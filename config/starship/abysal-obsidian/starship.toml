#-------------------------------------------------------------------------------------
#   Format
#-------------------------------------------------------------------------------------

format = """
$line_break \
$directory\
$git_branch\
$git_status\
$cmd_duration\
$docker\
$aws\
$status
[ └─➤ ](blue)"""

#--- properties ---#
add_newline = true 
continuation_prompt = "▶▶ "


#-------------------------------------------------------------------------------------
#   Palette
#-------------------------------------------------------------------------------------

palette = "abysal-obsidian"

[palettes.abysal-obsidian]
background = "#0E161A"
overlay = "#152025"
text = "#E3E9EB"
blue = "#2DD4BF"
gold = "#D9973A"
yellow = "#E9D568"
red = "#FF6369"


#-------------------------------------------------------------------------------------
#   Elements
#-------------------------------------------------------------------------------------

[directory]
truncation_length = 3
fish_style_pwd_dir_length = 3
truncate_to_repo = true
home_symbol = " ~"
read_only = "  "
format = "[](fg:blue)[◤](fg:blue bg:overlay)[  ](bold fg:text bg:overlay)[$path](bold fg:text bg:overlay)[$read_only ](bold fg:gold bg:overlay)[◤](fg:overlay)"

[git_branch]
format = "[](fg:blue)[◤](fg:blue bg:overlay)[  ](bold fg:text bg:overlay)[$branch](bold fg:text bg:overlay)"
truncation_symbol = "…/"

[git_status]
format = "[ $all_status$ahead_behind ](bold fg:gold bg:overlay)[◤](fg:overlay)"
stashed = " "
ahead = " ↑"
behind = " ↓"
diverged = " ↕"
conflicted = " "
untracked = " ?"
staged = " +"
modified = " !"
renamed = " »"
deleted = " ✘"

[cmd_duration]
min_time = 0
format = "[](fg:blue)[◤](fg:blue bg:overlay)[ ⏱  ](bold fg:text bg:overlay)[$duration ](bold fg:text bg:overlay)[◤](fg:overlay)"
show_milliseconds = true

[status]
disabled = false
format = "[](fg:red)[◤](fg:red bg:overlay)[ ✘ ](bold fg:red bg:overlay)[◤](fg:overlay)"


#-------------------------------------------------------------------------------------
#   Extra Elements
#-------------------------------------------------------------------------------------

[line_break]
disabled = false

[aws]
symbol = " "
format = "[](fg:blue)[◤](fg:blue bg:overlay)[ $symbol](bold fg:gold bg:overlay)[◤](bold fg:overlay)"

[docker_context]
symbol = " "
format = "[](fg:blue)[◤](fg:blue bg:overlay)[ $symbol](bold fg:gold bg:overlay)[◤](bold fg:overlay)"

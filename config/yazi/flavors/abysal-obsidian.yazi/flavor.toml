[app]
overall = { bg = "#0E161A" }

[mgr]
cwd = { fg = "#2DD4BF" }

find_keyword = { fg = "#D9973A", bold = true, italic = true, underline = true }
find_position = { fg = "#6EB99A", bg = "reset", bold = true, italic = true }

symlink_target = { italic = true }

marker_copied = { fg = "#D9973A", bg = "#D9973A" }
marker_cut = { fg = "#FF8352", bg = "#FF8352" }
marker_marked = { fg = "#6EB99A", bg = "#6EB99A" }
marker_selected = { fg = "#6EB99A", bg = "#6EB99A" }

count_copied = { fg = "#0C1214", bg = "#D9973A" }
count_cut = { fg = "#0C1214", bg = "#FF8352" }
count_selected = { fg = "#0C1214", bg = "#2DD4BF" }

border_symbol = "│"
border_style = { fg = "#1D2C34" }

syntect_theme = ""

[indicator]
padding = { open = "█", close = "█" }
parent = { fg = "#E3E9EB", bg = "#324A54" }
current = { fg = "#0C1214", bg = "#2DD4BF" }
preview = { fg = "#E3E9EB", bg = "#324A54" }

[tabs]
active = { fg = "#0C1214", bg = "#2DD4BF", bold = true }
inactive = { fg = "#7A8B8E", bg = "#1D2C34" }

sep_inner = { open = "", close = "" }
sep_outer = { open = "█", close = "" }

[mode]
normal_main = { fg = "#0C1214", bg = "#2DD4BF", bold = true }
normal_alt = { fg = "#E3E9EB", bg = "#152025", bold = true }

select_main = { fg = "#0C1214", bg = "#6EB99A", bold = true }
select_alt = { fg = "#E3E9EB", bg = "#152025", bold = true }

unset_main = { fg = "#0C1214", bg = "#FF6369", bold = true }
unset_alt = { fg = "#E3E9EB", bg = "#152025", bold = true }

[status]
overall = { bg = "#0E161A" }
sep_left = { open = "█", close = "" }
sep_right = { open = "", close = "█" }

perm_sep = { fg = "#5B6E72" }
perm_type = { fg = "#D9973A" }
perm_read = { fg = "#2DD4BF" }
perm_write = { fg = "#FF6369" }
perm_exec = { fg = "#D9973A" }

progress_label = { fg = "#E3E9EB", bold = true }
progress_normal = { fg = "#2DD4BF", bg = "#0E161A" }
progress_error = { fg = "#FF6369", bg = "#0E161A" }

[which]
cols = 3
mask = { bg = "#0E161A" }
cand = { fg = "#2DD4BF" }
rest = { fg = "#5B6E72" }
desc = { fg = "#D9973A" }
separator = "  "
separator_style = { fg = "#5B6E72" }

[confirm]
border = { fg = "#2DD4BF" }
title = { fg = "#FF6369", bold = true }
body = { fg = "#E3E9EB" }
list = { fg = "#E3E9EB" }
btn_yes = { fg = "#0C1214", bg = "#2DD4BF", bold = true }
btn_no = { fg = "#E3E9EB", bg = "#152025", bold = true }
btn_labels = ["  [y]es  ", "  (n)o  "]

[spot]
border = { fg = "#2DD4BF" }
title = { fg = "#2DD4BF", bold = true }

tbl_col = { fg = "#2DD4BF" }
tbl_cell = { fg = "#0C1214", bg = "#2DD4BF", bold = true }

[notify]
title_info = { fg = "#2DD4BF" }
title_warn = { fg = "#D9973A" }
title_error = { fg = "#FF6369" }

[pick]
border = { fg = "#2DD4BF" }
active = { fg = "#2DD4BF", bold = true }
inactive = { fg = "#7A8B8E" }

[input]
border = { fg = "#2DD4BF" }
title = { fg = "#2DD4BF", bold = true }
value = { fg = "#E3E9EB" }
selected = { reversed = true }

[cmp]
border = { fg = "#2DD4BF" }
active = { bg = "#152025", fg = "#2DD4BF", bold = true }
inactive = { fg = "#7A8B8E" }

[tasks]
border = { fg = "#2DD4BF" }
title = { fg = "#2DD4BF", bold = true }
hovered = { fg = "#E3E9EB", bg = "#2DD4BF", bold = true }

[help]
on = { fg = "#2DD4BF" }
run = { fg = "#D9973A" }
desc = { fg = "#D9973A" }
hovered = { fg = "#E3E9EB", bg = "#2DD4BF", bold = true }
footer = { fg = "#E3E9EB", bg = "#152025" }

[filetype]
rules = [
  # Primary: turquoise — code/text handled by fallback
  { mime = "image/*", fg = "#6C93E8" },
  { mime = "{audio,video}/*", fg = "#D9973A" },
  { mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "#FF6369" },
  { mime = "application/{pdf,doc,rtf}", fg = "#D9973A" },
  { mime = "application/vnd.oasis.opendocument.*", fg = "#D9973A" },
  { mime = "application/vnd.openxmlformats-officedocument.*", fg = "#D9973A" },

  { url = "*", is = "orphan", fg = "#0C1214", bg = "#FF6369" },
  { url = "*", is = "exec", fg = "#6C93E8" },
  { url = "*", is = "dummy", fg = "#0C1214", bg = "#FF6369" },
  { url = "*/", is = "dummy", fg = "#0C1214", bg = "#FF6369" },

  { url = "*/", fg = "#E3E9EB" },

  { url = "*", fg = "#E3E9EB" },
]

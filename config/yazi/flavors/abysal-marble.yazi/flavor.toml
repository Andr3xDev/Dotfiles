[app]
overall = { bg = "#F0F3F4" }

[mgr]
cwd = { fg = "#0D9488" }

find_keyword = { fg = "#8A5A1D", bold = true, italic = true, underline = true }
find_position = { fg = "#2E8A63", bg = "reset", bold = true, italic = true }

symlink_target = { italic = true }

marker_copied = { fg = "#8A5A1D", bg = "#8A5A1D" }
marker_cut = { fg = "#C43D22", bg = "#C43D22" }
marker_marked = { fg = "#2E8A63", bg = "#2E8A63" }
marker_selected = { fg = "#2E8A63", bg = "#2E8A63" }

count_copied = { fg = "#F5F6F5", bg = "#8A5A1D" }
count_cut = { fg = "#F5F6F5", bg = "#C43D22" }
count_selected = { fg = "#F5F6F5", bg = "#0D9488" }

border_symbol = "│"
border_style = { fg = "#8F9DA2" }

syntect_theme = ""

[indicator]
padding = { open = "█", close = "█" }
parent  = { fg = "#0D1518", bg = "#66777D" }
current = { fg = "#F5F6F5", bg = "#0D9488" }
preview = { fg = "#0D1518", bg = "#66777D" }

[tabs]
active = { fg = "#F5F6F5", bg = "#0D9488", bold = true }
inactive = { fg = "#33424A", bg = "#8F9DA2" }

sep_inner = { open = "", close = "" }
sep_outer = { open = "█", close = "" }

[mode]
normal_main = { fg = "#F5F6F5", bg = "#0D9488", bold = true }
normal_alt = { fg = "#0D1518", bg = "#D8E0E3", bold = true }

select_main = { fg = "#F5F6F5", bg = "#2E8A63", bold = true }
select_alt = { fg = "#0D1518", bg = "#D8E0E3", bold = true }

unset_main = { fg = "#F5F6F5", bg = "#C13034", bold = true }
unset_alt = { fg = "#0D1518", bg = "#D8E0E3", bold = true }

[status]
overall = { bg = "#F0F3F4" }
sep_left = { open = "", close = "" }
sep_right = { open = "", close = "" }

perm_sep = { fg = "#54646A" }
perm_type = { fg = "#8A7818" }
perm_read = { fg = "#0D9488" }
perm_write = { fg = "#C13034" }
perm_exec = { fg = "#8A5A1D" }

progress_label = { fg = "#0D1518", bold = true }
progress_normal = { fg = "#0D9488", bg = "#F0F3F4" }
progress_error = { fg = "#C13034", bg = "#F0F3F4" }

[which]
cols = 3
mask = { bg = "#F0F3F4" }
cand = { fg = "#0D9488" }
rest = { fg = "#54646A" }
desc = { fg = "#8A5A1D" }
separator = "  "
separator_style = { fg = "#54646A" }

[confirm]
border = { fg = "#0D9488" }
title = { fg = "#C13034", bold = true }
body = { fg = "#0D1518" }
list = { fg = "#0D1518" }
btn_yes = { fg = "#F5F6F5", bg = "#0D9488", bold = true }
btn_no = { fg = "#0D1518", bg = "#D8E0E3", bold = true }
btn_labels = ["  [y]es  ", "  (n)o  "]

[spot]
border = { fg = "#0D9488" }
title = { fg = "#0D9488", bold = true }

tbl_col = { fg = "#0D9488" }
tbl_cell = { fg = "#F5F6F5", bg = "#0D9488", bold = true }

[notify]
title_info = { fg = "#0D9488" }
title_warn = { fg = "#8A7818" }
title_error = { fg = "#C13034" }

[pick]
border = { fg = "#0D9488" }
active = { fg = "#0D9488", bold = true }
inactive = { fg = "#33424A" }

[input]
border = { fg = "#0D9488" }
title = { fg = "#0D9488", bold = true }
value = { fg = "#0D1518" }
selected = { reversed = true }

[cmp]
border = { fg = "#0D9488" }
active = { bg = "#D8E0E3", fg = "#0D9488", bold = true }
inactive = { fg = "#33424A" }

[tasks]
border = { fg = "#0D9488" }
title = { fg = "#0D9488", bold = true }
hovered = { fg = "#0D1518", bg = "#0D9488", bold = true }

[help]
on = { fg = "#0D9488" }
run = { fg = "#8A5A1D" }
desc = { fg = "#8A7818" }
hovered = { fg = "#0D1518", bg = "#0D9488", bold = true }
footer = { fg = "#0D1518", bg = "#D8E0E3" }

[filetype]
rules = [
  { mime = "image/*", fg = "#2F4EA8" },
  { mime = "{audio,video}/*", fg = "#8A5A1D" },
  { mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "#C13034" },
  { mime = "application/{pdf,doc,rtf}", fg = "#8A7818" },
  { mime = "application/vnd.oasis.opendocument.*", fg = "#8A7818" },
  { mime = "application/vnd.openxmlformats-officedocument.*", fg = "#8A7818" },

  { url = "*", is = "orphan", fg = "#F5F6F5", bg = "#C13034" },
  { url = "*", is = "exec", fg = "#2F4EA8" },
  { url = "*", is = "dummy", fg = "#F5F6F5", bg = "#C13034" },
  { url = "*/", is = "dummy", fg = "#F5F6F5", bg = "#C13034" },

  { url = "*/", fg = "#0D1518" },

  { url = "*", fg = "#0D1518" },
]
